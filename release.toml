# cargo-release configuration for aerofi
# Usage: cargo release [patch|minor|major] --execute

# Do not publish to crates.io automatically for now (relies on GitHub Releases)
publish = false

# Tag format
tag-name = "v{{version}}"

# Commit message for the version bump
pre-release-commit-message = "chore(core): bump version to {{version}}"
# Note: cargo-release has no DCO option. The Signed-off-by trailer on
# bump commits comes from the prepare-commit-msg hook in
# scripts/git-hooks/ (install: git config core.hooksPath scripts/git-hooks).

# Push the commit and tag to the remote
push = true
