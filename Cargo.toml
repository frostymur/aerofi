[workspace]
members = [
  "aerofi-plugin-api",
  "examples/plugins/web_search",
  "examples/plugins/file_search",
]

# Shared version so `cargo release` renders {{version}} in the bump commit
# message (without it the workspace commit template has no version variable).
[workspace.package]
version = "0.2.6"

[package]
name = "aerofi"
version.workspace = true
edition = "2024"
license = "MIT"
publish = false

[dependencies]

gpui = { git = "https://github.com/zed-industries/zed", rev = "a3f6b96ced39a4dba8d9db55b81d8b6362840899" }

gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a3f6b96ced39a4dba8d9db55b81d8b6362840899", features = [
  "runtime_shaders",
  "font-kit",
] }

# Fuzzy search
nucleo-matcher = "0.3"

# Dynamic Plugins
libloading = "0.8"
aerofi-plugin-api = { path = "aerofi-plugin-api", version = "0.1.0" }

# Markdown parsing for full-output script results (MIT/Apache-2.0, no deps)
pulldown-cmark = { version = "0.13", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Home/config directory resolution
dirs = "5.0"

# macOS AppKit bindings (per PROJECT_RULES.md)
# objc2-app-kit ships per-class feature gates; enable only classes we touch.
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = [
  "NSApplication",
  "NSImage",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-foundation = "0.2.2"

# Image decoding/resizing for icon downsampling (matches GPUI's version).
image = { version = "0.25.1", default-features = false, features = ["tiff", "jpeg", "png", "gif", "webp"] }
# Same raw-window-handle version GPUI uses, so we can read the content NSView pointer
raw-window-handle = "0.6"
futures = "0.3.34"
libc = "0.2.189"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
