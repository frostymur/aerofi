[package]
name = "aerofi"
version = "0.0.5"
edition = "2024"
license = "MIT"

[dependencies]

gpui = { git = "https://github.com/zed-industries/zed", rev = "a3f6b96ced39a4dba8d9db55b81d8b6362840899" }

gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a3f6b96ced39a4dba8d9db55b81d8b6362840899", features = [
  "runtime_shaders",
  "font-kit",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Fuzzy search
nucleo-matcher = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Home/config directory resolution
dirs = "5.0"

# macOS AppKit bindings (per PROJECT_RULES.md) - used to strip window chrome.
# objc2-app-kit ships per-class feature gates; enable the classes we touch.
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = [
  "NSApplication",
  "NSButton",
  "NSColor",
  "NSControl",
  "NSImage",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-foundation = "0.2.2"

# Image decoding/resizing for icon downsampling (matches GPUI's version).
image = { version = "0.25.1", default-features = false, features = ["tiff", "jpeg"] }
# Same raw-window-handle version GPUI uses, so we can read the content NSView pointer
raw-window-handle = "0.6"
