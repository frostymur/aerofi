# ==============================================================================
# aerofi - Complete Theme Reference (theme.toml)
# ==============================================================================
# Location: ~/.config/aerofi/themes/{theme}.toml
# Activate: In ~/.config/aerofi/config.toml, set theme = "{theme}"
# Reload:   Press Cmd+R in aerofi to reload styles instantly
# ==============================================================================

name   = "Complete Reference Theme"
author = "aerofi"

# ------------------------------------------------------------------------------
# imports - Modular Theme Splitting (Optional)
# ------------------------------------------------------------------------------
# Relative paths from ~/.config/aerofi/themes/ to import base themes or mixins.
# Tables are recursively deep-merged; arrays (children, layout) are replaced.
# Type: Array of Strings (Optional)
#
# imports = [
#     "colors/tokyo-night.toml",
#     "layouts/compact.toml",
# ]



# ------------------------------------------------------------------------------
# [font] - Typography Settings
# ------------------------------------------------------------------------------
[font]
# Primary font family, applied to the whole UI. System fonts, fonts you
# install, and files dropped in ~/.config/aerofi/fonts/ (loaded at startup)
# are all supported.
# Type: String
# Default: "SF Pro Text"
family = "SF Pro Text"

# Base font size in points.
# Type: Float (f32)
# Default: 15.0
size = 15.0

# Base font weight: a number ("100".."900") or a name
# ("thin", "light", "regular", "medium", "semibold", "bold", "heavy").
# Type: String (Optional)
# Default: "regular"
# weight = "regular"

# Fallback fonts used when primary font misses glyphs or symbols.
# Type: Array of Strings (Optional)
fallback = ["SF Pro", "SF Mono", "Helvetica Neue", "Arial"]


# ------------------------------------------------------------------------------
# [window] - Native macOS Window Frame & Glassmorphism
# ------------------------------------------------------------------------------
[window]
# Dimensions in points, or a screen-relative percentage string (e.g. "50%").
# Type: Float (f32) or String ("XX%")
width = "49.0%"
height = "50.2%"

# Inner padding around the window container.
# Type: Float (f32)
padding = 16.0

# Background color (supports hex and $color aliases).
# Type: String (Hex #RRGGBB or #RRGGBBAA)
background = "$bg"

# Native macOS translucent frosted glass blur.
# Type: Boolean
# When true, the native macOS compositor applies a real-time blur behind the window.
blur = true

# Background opacity level (0.0 = fully transparent, 1.0 = fully opaque).
# Type: Float (f32)
# Recommended with blur: 0.88 - 0.96
background_opacity = 0.94

# Window corner radius in points.
# Type: Float (f32)
corner_radius = 16.0

# Window border width and color.
# Type: Float (f32), String (Hex / $alias)
border_width = 1.0
border_color = "$border"

# Position offset from screen centre in points. 0.0 = centred;
# negative = towards the left/top edge.
# Type: Float (f32), Float (f32)
x_offset = 0.0
y_offset = 0.0

# Optional background image overlay:
# background_image = "~/.config/aerofi/themes/wallpaper.jpg"
# Position: "cover" (full background), "left" or "right" (side panel).
# Unknown values fall back to "cover".
# background_position = "cover"


# ------------------------------------------------------------------------------
# [script_view] - Full-Window Script View (fullOutput / rofi scripts)
# ------------------------------------------------------------------------------
# The full-window script view replaces the [mainbox] launcher layout when a
# script takes over the whole window with its output or interactive results
# (the fullOutput and rofi script modes, and the theme switcher). It does not
# apply to the launcher, inline (a row subtitle), or the silent/compact toasts.
#
# Extra padding around the view's content, in points (default: 0).
# Useful when [window].padding = 0 (e.g. an image pane reaches the window
# edge) but you still want the script view inset.
# Type: Float (f32)
# Default: 0.0
# padding = 10.0


# ------------------------------------------------------------------------------
# [presets.<name>.element] - Presets (per-script element overrides)
# ------------------------------------------------------------------------------
# A preset is a per-script override. A script declares one via
# `# @aerofi.preset <name>`.
# Unset fields inherit from [element].
# A preset may also override the window width for that script via
# `window_width` (points or "XX%"); the window resizes when the script's
# Rofi view opens/closes.
#
# Note: preset `padding` uses [vertical, horizontal] — the opposite order
# of the base [element].padding ([horizontal, vertical]).
#
# [presets.emoji]
# window_width = 640.0
# [presets.emoji.element]
# padding = [4.0, 4.0]
# icon_size = 48.0
# corner_radius = 8.0
# columns = 8
#
# [presets.clipboard.element]
# padding = [10.0, 14.0]


# ------------------------------------------------------------------------------
# [mainbox] - Top-Level Container & Layout
# ------------------------------------------------------------------------------
[mainbox]
# Container orientation: "vertical" (stacked) or "horizontal" (side-by-side).
# Type: String
# Default: "vertical"
orientation = "vertical"

# Child elements rendered inside the main container.
# Type: Array of Strings
# Built-in identifiers:
#   "InputBar"   - The search query input field
#   "ListView"   - The scrollable list of filtered results
# Custom widgets:
#   Any custom widget ID defined under [widgets.<id>] can be included here!
children = [
    "header_bar",
    "InputBar",
    "ListView",
    "footer_bar"
]

# Gap between the mainbox children in points. Defaults to [listview].spacing
# when unset.
# Type: Float (f32)
# gap = 8.0


# ------------------------------------------------------------------------------
# [inputbar] - Search Input Field
# ------------------------------------------------------------------------------
[inputbar]
# Height of the search input box in points.
# Type: Float (f32)
height = 46.0

# Inner padding: [horizontal, vertical].
# Type: Array of Floats (f32)
padding = [14.0, 10.0]

# Outer margin around inputbar: [top, right, bottom, left].
# Type: Array of Floats (f32)
margin = [0.0, 0.0, 8.0, 0.0]

# Background and text colors.
# Type: String (Hex / $alias)
background = "$surface"
text_color = "$text"

# Search bar placeholder text and color.
# Type: String, String (Hex / $alias)
placeholder = "Search apps, scripts, commands…"
placeholder_color = "$subtle"

# Corner radius of the input bar.
# Type: Float (f32)
corner_radius = 10.0

# Border around the input bar. 0.0 = no border.
# Type: Float (f32), String (Hex / $alias)
border_width = 0.0
border_color = "transparent"

# Input field leading prompt icon and color.
# Type: String (Optional), String (Hex / $alias)
icon = "❯"
icon_color = "$accent"

# Optional font override for the search text. Any subset of the global
# [font] fields; unset fields inherit.
# [inputbar.font]
# family = "JetBrains Mono"
# size = 15.0
# weight = "500"
# fallback = ["SF Mono"]


# ------------------------------------------------------------------------------
# [listview] - Results List View & Badges
# ------------------------------------------------------------------------------
[listview]
# Number of columns: 1 (standard vertical list), 2, 3 (grid layout).
# Type: Integer (usize)
columns = 1

# Spacing between item rows in points.
# Type: Float (f32)
spacing = 4.0

# Highlight the query's matched characters inside item names.
# Type: Boolean
highlight_matches = true

# Colour of the highlighted characters. Defaults to status_colors.accent
# when unset.
# Type: String (Hex / $alias)
# match_color = "$accent"

# Placeholder text shown when no items match search query.
# Type: String, String (Hex / $alias)
empty_text = "No matching items found"
empty_text_color = "$subtle"

# When true, the listview is collapsed until the user starts typing.
# Type: Boolean (Optional)
# require_input = false

# Category Badge Styling ("Script", "Application", "Plugin")
[listview.category_badge]
show = true
color = "$subtle"
font_size_offset = 3.0
radius = 4.0
padding_x = 6.0
border = false
border_color = "$border"

# Alias Pill Badge Styling (for items matched via [aliases])
[listview.alias_badge]
show = true
color = "$accent"
font_size_offset = 3.0
radius = 4.0
padding_x = 6.0
border = true
border_color = "$accent"


# ------------------------------------------------------------------------------
# [element] - List Row Elements
# ------------------------------------------------------------------------------
[element]
# Padding inside each row: [horizontal, vertical].
# Type: Array of Floats (f32)
padding = [12.0, 8.0]

# Corner radius for each row capsule.
# Type: Float (f32)
corner_radius = 8.0

# Default non-selected row styling.
# Type: String (Hex / $alias)
background = "transparent"
text_color = "$text"
description_color = "$subtle"

# Icon display options.
# Type: Boolean, Float (f32)
show_icons = true
icon_size = 22.0

# Gap between the icon and the name inside a grid cell (points).
# Type: Float (f32)
# Default: 6.0
icon_gap = 6.0

# Border drawn around each item. 0.0 = borderless tile.
# Type: Float (f32)
# Default: 1.0
border_width = 1.0

# Corner radius applied to the item's icon image.
# Type: Float (f32)
# Default: 4.0
icon_radius = 4.0

# Row internal slot layout order.
# Type: Array of Strings (Optional)
# Available slot identifiers:
#   "icon"           - App or script icon
#   "name"           - Primary title text (subtitle / description renders here)
#   "spacer"         - Expanding flexible space
#   "category_badge" - Right-aligned category pill
#   "alias_badge"    - Shorthand alias badge
#   "shortcut"       - Bound key combination (e.g. ⌘R)
layout = [
    "icon",
    "name",
    "spacer",
    "category_badge",
    "shortcut"
]

# Highlighted item styling (currently focused item)
[element.selected]
background = "$surface2"
text_color = "$text"
description_color = "$accent"

# Optional font override for row names. Any subset of the global
# [font] fields; unset fields inherit.
# [element.font]
# family = "JetBrains Mono"
# size = 15.0
# weight = "bold"
# fallback = ["SF Mono"]

# ------------------------------------------------------------------------------
# [status_colors] - Semantic Colors for Rofi Mode
# ------------------------------------------------------------------------------
[status_colors]
urgent_background = "$urgent"
urgent_text = "#ffffff"
urgent_row_background = "#f7768e22"

active_background = "$green"
active_text = "#1a1b26"
active_row_background = "#9ece6a22"

accent = "$accent"
muted = "$subtle"


# ------------------------------------------------------------------------------
# [toast] - Compact Floating Notifications
# ------------------------------------------------------------------------------
[toast]
running_dot = "#aaaaaa"
success_dot = "$green"
error_dot = "$urgent"


# ==============================================================================
# Custom Widgets System
# ==============================================================================
# Define custom widgets using table syntax [widgets.<id>] (or array syntax
# [[widgets]]). Custom widgets can be inserted into [mainbox.children] or
# into Box containers.
#
# Complete property reference for every widget type (all fields except
# `type`/`id` are optional unless noted):
#
# [widgets.example_box]
# type = "box"
# orientation = "horizontal"   # "horizontal" | "vertical"
# gap = 8.0                    # spacing between children (points)
# padding = [8.0, 4.0]         # [horizontal, vertical]
# align = "center"             # "left" | "center" | "end"
# background = "$surface"      # Hex / $alias
# radius = 8.0
# width = 400.0                # fixed size (points); unset = content-sized
# height = 24.0
# flex = true                  # expand to fill the remaining space
# children = ["child_a", "child_b"]
#
# [widgets.example_text]
# type = "text"
# text = "Static label"
# color = "$text"
# font_size = 12.0
# font_weight = "semibold"     # name ("thin".."heavy") or number 100..900
# align = "left"               # "left" | "center" | "end"
#
# [widgets.example_icon]
# type = "icon"
# icon = "⚡"                   # Nerd Font glyph or emoji
# size = 14.0
# color = "$accent"
#
# [widgets.example_image]
# type = "image"
# path = "~/.config/aerofi/themes/logo.png"
# width = 48.0                # fixed width (points)
# height = 48.0
# radius = 8.0
# w_full = true               # stretch across the container instead of
#                             # `width`
# h_full = true               # stretch to fill the container's height
#
# [widgets.example_spacer]
# type = "spacer"               # expands along the parent's orientation
#
# [widgets.example_divider]
# type = "divider"
# color = "$border"
# thickness = 1.0
# margin = 8.0
#
# [widgets.example_button]
# type = "button"
# text = "Action"
# icon = "🔄"
# action = "Target name"        # runs the named target (app/script/builtin)
# hotkey = "cmd+r"              # optional in-launcher shortcut
# close = true                  # default: launcher hides after the action;
#                               # set false to keep it open
# color = "$text"
# background = "$surface"
# hover_background = "$surface2"
# hover_color = "$accent"
# border_color = "$border"
# border_width = 1.0
# radius = 6.0
# padding = [4.0, 8.0]          # [horizontal, vertical]
# font_size = 11.0
# font_weight = "medium"
# gap = 4.0                     # icon-text gap
# ==============================================================================

# Custom Header Bar (Box containing title icon and branding text)
[widgets.header_bar]
type = "box"
orientation = "horizontal"
gap = 8.0
padding = [4.0, 4.0]
align = "center"
children = ["logo_icon", "brand_title", "header_spacer", "status_indicator"]

[widgets.logo_icon]
type = "icon"
icon = "⚡"
size = 14.0
color = "$accent"

[widgets.brand_title]
type = "text"
text = "aerofi launcher"
color = "$subtle"
font_size = 12.0
font_weight = "semibold"

[widgets.header_spacer]
type = "spacer"

[widgets.status_indicator]
type = "text"
text = "v0.1.0"
color = "$subtle"
font_size = 11.0

# Custom Footer Bar with interactive action buttons
[widgets.footer_bar]
type = "box"
orientation = "horizontal"
gap = 8.0
padding = [8.0, 4.0]
align = "center"
children = ["footer_help", "footer_spacer", "reload_btn", "config_btn"]

[widgets.footer_help]
type = "text"
text = "Press ↵ to open • ⎋ to close"
color = "$subtle"
font_size = 11.0

[widgets.footer_spacer]
type = "spacer"

[widgets.reload_btn]
type = "button"
text = "Reload"
icon = "🔄"
action = "Reload Configuration"
hotkey = "cmd+r"
color = "$text"
background = "$surface"
hover_background = "$surface2"
radius = 6.0
padding = [4.0, 8.0]
font_size = 11.0
gap = 4.0

[widgets.config_btn]
type = "button"
text = "Themes"
icon = "🎨"
action = "Theme Switcher"
hotkey = "cmd+t"
color = "$text"
background = "$surface"
hover_background = "$surface2"
radius = 6.0
padding = [4.0, 8.0]
font_size = 11.0
gap = 4.0


# ------------------------------------------------------------------------------
# [colors] - Named Palette Aliases
# ------------------------------------------------------------------------------
# Define custom variables here. Any "$key" in any color field is replaced
# with the corresponding hex value. Supports 6-digit and 8-digit hex (alpha).
[colors]
bg = "#1a1b26f0"
surface = "#24283b"
surface2 = "#414868"
border = "#41486880"
text = "#c0caf5"
subtle = "#565f89"
accent = "#7aa2f7"
green = "#9ece6a"
urgent = "#f7768e"
