# Tokyo Night Grid Theme for aerofi
name   = "Tokyo Night Grid"
author = "aerofi"

imports = [
    "colors/tokyo-night.toml",
    "layouts/grid.toml",
]

[window]
background_opacity = 0.75

[colors]
bg       = "#1a1b26f4"
surface2 = "#343b58"

[presets.grid.element]
columns = 8
icon_size = 72.0
padding = [10.0, 20.0]
corner_radius = 12.0

[presets.power.element]
# Bigger tiles for the power menu (few items, 2 columns).
icon_size = 84.0
padding = [14.0, 20.0]
corner_radius = 14.0

[presets.list.element]
icon_size = 22.0
padding = [8.0, 12.0]
corner_radius = 8.0

[presets.compact.element]
padding = [8.0, 12.0]
icon_size = 22.0
corner_radius = 8.0
