# Tokyo Night Grid Theme for aerofi
# Tokyo Night palette with a compact square tile grid layout.

name   = "Tokyo Night Grid"
author = "aerofi"

imports = [
    "colors/tokyo-night.toml",
    "layouts/grid.toml",
]

# The grid variant uses a slightly more opaque background and a distinct tile
# surface, overriding those two values from the shared Tokyo Night palette.
[colors]
bg       = "#1a1b26f4"
surface2 = "#343b58"
