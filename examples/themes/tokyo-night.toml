# Tokyo Night Theme for aerofi
name   = "Tokyo Night"
author = "aerofi"

imports = [
    "colors/tokyo-night.toml",
    "layouts/compact.toml",
]

[window]
background_opacity = 0.75

[presets.grid.element]
columns = 8
icon_size = 72.0
padding = [10.0, 20.0]
corner_radius = 12.0

[presets.list.element]
icon_size = 22.0
padding = [8.0, 12.0]
corner_radius = 8.0
