# Tokyo Night Theme for aerofi
# Composed from the reusable Tokyo Night palette and the compact list layout.
# Inspired by Tokyo Night for Neovim/Alacritty/VSCode.

name   = "Tokyo Night"
author = "aerofi"

imports = [
    "colors/tokyo-night.toml",
    "layouts/compact.toml",
]

[window]
background_opacity = 0.75

[presets.grid.element]
columns = 8
icon_size = 48.0
padding = [4.0, 4.0]
corner_radius = 8.0
