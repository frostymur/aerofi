# AeroFi theme configuration — Tokyo Night
# All color fields accept hex (#rrggbb) or $alias references (see [colors]).
# Every field has a built-in default; only override what you need.
# Optional fields (marked "opt") can be omitted to use the default.

name    = "Tokyo Night"
author  = "AeroFi"

# ---------------------------------------------------------------------------
# Font
# ---------------------------------------------------------------------------
[font]
family   = "SF Pro Text"   # string — font family name
size     = 17.0            # f32   — base font size in points
# weight   = "Medium"      # opt<string> — e.g. "Medium", "Semibold"
fallback = ["SF Mono"]     # opt<vec<string>> — fallback font families

# ---------------------------------------------------------------------------
# Window
# ---------------------------------------------------------------------------
[window]
width              = 800.0   # f32 — window width in logical points
height             = 500.0   # f32 — window height in logical points
padding            = 16.0    # f32 — inner padding around content
background         = "$bg"   # string — window background color
# background_image   = "/path/to/img.png"  # opt<string> — background image path
# background_position = "cover"            # opt<string> — "cover"|"left"|"right"|"center"
# image_scale        = 1.0                 # opt<f32> — background image scale
blur               = false   # bool — frosted-glass blur behind window
# background_opacity = 0.9                # opt<f32> — 0.0 (transparent) .. 1.0 (opaque)
corner_radius      = 12.0    # f32 — window corner radius
border_width       = 1.0     # f32 — window border width
border_color       = "$border" # string — window border color

# ---------------------------------------------------------------------------
# Container (main layout)
# ---------------------------------------------------------------------------
[mainbox]
orientation = "vertical"                    # string — "vertical" | "horizontal"
children    = ["InputBar", "ListView"]      # vec<widget> — widget order

# ---------------------------------------------------------------------------
# Banner (optional top image)
# Uncomment the [banner] section to show an image above the input bar.
# ---------------------------------------------------------------------------
# [banner]
# image_path = "/path/to/image.png"   # string — image file path
# height     = 120.0                  # f32 — banner height in points
# align      = "center"               # opt<string> — "left"|"center"|"right"

# ---------------------------------------------------------------------------
# InputBar
# ---------------------------------------------------------------------------
[inputbar]
height           = 48.0              # f32 — input bar height
padding          = [12.0, 16.0]      # vec<f32> — [horizontal, vertical] padding
margin           = [0.0, 0.0, 8.0, 0.0] # vec<f32> — [top, right, bottom, left] margin
background       = "$surface"        # string — input bar background
text_color       = "$text"           # string — typed text color
placeholder      = "Type to filter…" # string — placeholder text
placeholder_color = "$subtle"        # string — placeholder text color
corner_radius    = 8.0              # f32 — input bar corner radius
icon             = "❯"              # opt<string> — leading icon text
icon_color       = "$accent"        # opt<string> — icon color

# ---------------------------------------------------------------------------
# ListView
# ---------------------------------------------------------------------------
[listview]
columns           = 1       # usize — number of columns (1 = list, >1 = grid)
spacing           = 6.0     # f32 — vertical spacing between rows
scrollbar         = false   # bool — show scrollbar
empty_text        = "No matches"  # string — text when no results
empty_text_color  = "$subtle"     # string — empty text color
# require_input     = true    # opt<bool> — hide list until user types

# Category badge (e.g. "Script", "Application", "Aerofi") — right side of row
[listview.category_badge]
show              = true    # bool — show/hide the badge
color             = "$subtle" # string — text color
font_size_offset  = 2.0    # f32 — subtracted from base font size
radius            = 0.0    # f32 — corner radius (0 = no pill shape)
padding_x         = 0.0    # f32 — horizontal padding
border            = false  # bool — draw a border around the badge
# border_color      = "$border" # opt<string> — border color (falls back to color)

# Alias pill badges (e.g. "twit", "gh") — right side of row
[listview.alias_badge]
show              = true    # bool — show/hide the badge
color             = "$accent" # string — text color
font_size_offset  = 3.0    # f32 — subtracted from base font size
radius            = 4.0    # f32 — corner radius
padding_x         = 4.0    # f32 — horizontal padding
border            = true   # bool — draw a border around the badge
border_color      = "$border" # opt<string> — border color (falls back to color)

# ---------------------------------------------------------------------------
# Element (list row styling)
# ---------------------------------------------------------------------------
[element]
padding          = [8.0, 12.0]    # vec<f32> — [horizontal, vertical] row padding
corner_radius    = 8.0            # f32 — row corner radius
background       = "transparent"  # string — row background
text_color       = "$text"        # string — item name color
description_color = "$subtle"     # opt<string> — shortcut / description color
show_icons       = true           # bool — show item icons
icon_size        = 24.0           # f32 — icon dimensions (square)
# layout           = ["icon", "name", "badge"] # opt<vec<string>> — custom layout

# Selected row state
[element.selected]
background        = "$surface2"   # string — selected row background
text_color        = "$text"       # string — selected row text color
description_color = "$subtle"     # opt<string> — selected description color

# Hover row state (optional — omit entire section to disable)
[element.hover]
background        = "$surface1"   # string — hovered row background
text_color        = "$text"       # string — hovered row text color
description_color = "$subtle"     # opt<string> — hovered description color

# ---------------------------------------------------------------------------
# Color aliases
# Reference these with $name in any color field above.
# ---------------------------------------------------------------------------
[colors]
bg        = "#1a1b26"
surface   = "#24283b"
surface1  = "#33374a"
surface2  = "#414868"
border    = "#414868"
text      = "#c0caf5"
subtle    = "#565f89"
accent    = "#7aa2f7"
green     = "#9ece6a"
red       = "#f7768e"
yellow    = "#e0af68"
