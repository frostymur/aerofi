# ==============================================================================
# Grid Tile Layout (Mixin)
# ==============================================================================
# Location: ~/.config/aerofi/themes/layouts/grid.toml
# Import via: imports = ["layouts/grid.toml"]
# Shared 4-column tile grid geometry used by tokyo-night-grid.
# ==============================================================================

[font]
family = "SF Pro Text"
size = 12.5
fallback = ["SF Pro", "Helvetica Neue", "Arial"]

[window]
width = 520.0
height = 360.0
padding = 10.0
background = "$bg"
blur = true
background_opacity = 0.95
corner_radius = 16.0
border_width = 1.0
border_color = "$border"

[mainbox]
orientation = "vertical"
children = ["InputBar", "ListView"]

[inputbar]
height = 36.0
padding = [8.0, 12.0]
margin = [0.0, 0.0, 8.0, 0.0]
background = "$surface"
text_color = "$text"
placeholder = "Search apps & scripts…"
placeholder_color = "$subtle"
corner_radius = 8.0
icon = "❯"
icon_color = "$accent"

[listview]
columns = 4
spacing = 6.0
scrollbar = false
empty_text = "No matching results"
empty_text_color = "$subtle"

[listview.category_badge]
show = false
color = "$subtle"

[listview.alias_badge]
show = true
color = "$accent"

[element]
padding = [20.0, 8.0]
corner_radius = 12.0
background = "$surface"
text_color = "$text"
description_color = "$subtle"
show_icons = true
icon_size = 36.0
layout = ["icon", "name"]

[element.selected]
background = "$surface2"
text_color = "$text"
description_color = "$accent"

[element.hover]
background = "$surface2"
text_color = "$text"
description_color = "$subtle"
