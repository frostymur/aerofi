# ==============================================================================
# Catppuccin Split Layout (Mixin)
# ==============================================================================
# Split two-pane layout: no blur, zero window padding, flush right pane,
# wider left-panel padding.
# Import via: imports = ["layouts/catppuccin-split.toml"]
# Requires the palette to define an opaque `panel` colour.
# ==============================================================================

[font]
family = "SF Pro Text"
size = 15.0
weight = 300
fallback = ["SF Pro", "Helvetica Neue", "Arial"]

[window]
width = "62.0%"
height = "50.2%"
padding = 0.0
background = "$bg"
blur = false
background_opacity = 0.8
corner_radius = 18.0
border_width = 0.0
border_color = "$border"

[mainbox]
orientation = "horizontal"
gap = 0.0
children = ["left_panel", "right_panel"]

[inputbar]
height = 46.0
padding = [10.0, 14.0]
margin = [0.0, 0.0, 0.0, 0.0]
background = "$surface"
text_color = "$text"
placeholder = "Search apps, scripts, commands…"
placeholder_color = "$subtle"
corner_radius = 10.0
icon = "❯"
icon_color = "$accent"

[listview]
columns = 1
spacing = 8.0
empty_text = "No matching results"
empty_text_color = "$subtle"

[listview.category_badge]
show = false
color = "$subtle"

[listview.alias_badge]
show = false
color = "$accent"

[element]
padding = [8.0, 12.0]
corner_radius = 8.0
background = "transparent"
text_color = "$text"
description_color = "$subtle"
show_icons = true
icon_size = 24.0
icon_gap = 8.0
border_width = 0.0
icon_radius = 6.0
layout = ["icon", "name", "spacer"]

[element.selected]
background = "$accent"
text_color = "#1e1e2e"
description_color = "#1e1e2e"

# Left pane: transparent (no blur), search bar on top.
[widgets.left_panel]
type = "box"
orientation = "vertical"
flex = true
gap = 12.0
padding = [20.0, 24.0]
children = ["InputBar", "panel_spacer"]

# Right pane: opaque background, flush to window edges.
[widgets.right_panel]
type = "box"
orientation = "vertical"
flex = true
gap = 8.0
padding = [8.0, 10.0]
background = "$panel"
radius = 0.0
children = ["ListView"]

[widgets.panel_spacer]
type = "spacer"
