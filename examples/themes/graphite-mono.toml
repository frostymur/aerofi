# Graphite Mono Theme for aerofi
name   = "Graphite Mono"
author = "aerofi"

imports = [
    "colors/graphite-mono.toml",
    "layouts/graphite-split.toml",
]

[gui]
padding = 10.0

[presets.emoji.element]
columns = 8
icon_size = 40.0
padding = [10.0, 16.0]
corner_radius = 12.0

[presets.power]
window_width = "46.3%"

[presets.power.element]
# Bigger tiles for the power menu (few items, 2 columns).
icon_size = 84.0
padding = [14.0, 20.0]
corner_radius = 14.0

[presets.list.element]
icon_size = 22.0
padding = [8.0, 12.0]
corner_radius = 8.0
