# AeroFi theme configuration — Horizon
# A modern, horizontal split-pane theme showcasing the full power of custom widgets:
# - Horizontal mainbox layout with dedicated left sidebar and right content pane
# - Custom widget tree: nested Box containers with background, padding, radius, width, and flex
# - Interactive sidebar buttons for reloading config, opening terminal, and opening scripts
# - Context-aware action buttons inside each result row (Run, Edit, Copy) via element.layout
# - Curated cyber-slate dark palette with vivid electric accents and frosted glass blur

name   = "Horizon"
author = "AeroFi"

# ---------------------------------------------------------------------------
# Font
# ---------------------------------------------------------------------------
[font]
family   = "SF Pro Text"
size     = 14.0
fallback = ["SF Mono", "Menlo"]

# ---------------------------------------------------------------------------
# Window
# ---------------------------------------------------------------------------
[window]
width              = 880.0
height             = 540.0
padding            = 16.0
background         = "$bg"
blur               = true
background_opacity = 0.96
corner_radius      = 16.0
border_width       = 1.0
border_color       = "$border"

# ---------------------------------------------------------------------------
# Main Layout (Horizontal Split)
# ---------------------------------------------------------------------------
[mainbox]
orientation = "horizontal"
children    = ["sidebar", "main_pane"]

# ---------------------------------------------------------------------------
# InputBar
# ---------------------------------------------------------------------------
[inputbar]
height            = 44.0
padding           = [12.0, 14.0]
margin            = [0.0, 0.0, 4.0, 0.0]
background        = "$surface"
text_color        = "$text"
placeholder       = "Type to search apps, scripts, or aliases..."
placeholder_color = "$subtle"
corner_radius     = 10.0
icon              = "🔍"
icon_color        = "$accent"

# ---------------------------------------------------------------------------
# ListView
# ---------------------------------------------------------------------------
[listview]
columns          = 1
spacing          = 4.0
scrollbar        = false
empty_text       = "No matching targets"
empty_text_color = "$subtle"

[listview.category_badge]
show             = true
color            = "$badge_text"
font_size_offset = 2.0
radius           = 4.0
padding_x        = 5.0
border           = true
border_color     = "$border"

[listview.alias_badge]
show             = true
color            = "$accent"
font_size_offset = 2.0
radius           = 4.0
padding_x        = 5.0
border           = true
border_color     = "$accent_dim"

# ---------------------------------------------------------------------------
# Element (Row Styling & Dynamic Layout)
# ---------------------------------------------------------------------------
[element]
padding           = [8.0, 10.0]
corner_radius     = 8.0
background        = "transparent"
text_color        = "$text"
description_color = "$subtle"
show_icons        = true
icon_size         = 22.0
# Dynamic row slots: includes built-ins + custom row action buttons!
layout            = ["icon", "name", "spacer", "btn_copy", "btn_edit", "btn_run", "shortcuts", "badge"]

[element.selected]
background        = "$surface"
text_color        = "$text"
description_color = "$subtle"

[element.hover]
background        = "$hover_bg"
text_color        = "$text"
description_color = "$subtle"

# ---------------------------------------------------------------------------
# Color Palette
# ---------------------------------------------------------------------------
[colors]
bg          = "#0d1117"
sidebar_bg  = "#161b22"
surface     = "#21262d"
card_bg     = "#1c2128"
hover_bg    = "#30363d"
border      = "#30363d"
accent      = "#58a6ff"
accent_dim  = "#1f3b5c"
badge_text  = "#7d8590"
text        = "#f0f6fc"
text_subtle = "#c9d1d9"
subtle      = "#8b949e"
green       = "#3fb950"
red         = "#f85149"
purple      = "#bc8cff"

# ---------------------------------------------------------------------------
# Custom Widgets
# ---------------------------------------------------------------------------

# === Left Sidebar ===
[widgets.sidebar]
type        = "box"
orientation = "vertical"
width       = 230.0
padding     = [14.0, 14.0]
gap         = 10.0
background  = "$sidebar_bg"
radius      = 12.0
children    = [
    "sidebar_header",
    "sidebar_divider",
    "section_quick",
    "btn_reload",
    "btn_terminal",
    "btn_scripts",
    "sidebar_spacer",
    "stats_card"
]

[widgets.sidebar_header]
type        = "box"
orientation = "horizontal"
gap         = 8.0
align       = "center"
children    = ["app_icon", "app_title"]

[widgets.app_icon]
type  = "icon"
icon  = "⚡"
size  = 18.0
color = "$accent"

[widgets.app_title]
type        = "text"
text        = "AeroFi"
font_size   = 14.0
font_weight = "bold"
color       = "$text"

[widgets.sidebar_divider]
type      = "divider"
color     = "$border"
thickness = 1.0
margin    = 2.0

[widgets.section_quick]
type        = "text"
text        = "QUICK ACTIONS"
font_size   = 10.0
font_weight = "bold"
color       = "$subtle"

[widgets.btn_reload]
type             = "button"
icon             = "🔄"
text             = "Reload Config"
action           = "reload"
color            = "$text_subtle"
hover_color      = "$accent"
hover_background = "$hover_bg"
radius           = 8.0
padding          = [8.0, 8.0]
font_size        = 12.0
font_weight      = "medium"
gap              = 8.0

[widgets.btn_terminal]
type             = "button"
icon             = "💻"
text             = "Terminal"
action           = "command:open -a Terminal"
color            = "$text_subtle"
hover_color      = "$accent"
hover_background = "$hover_bg"
radius           = 8.0
padding          = [8.0, 8.0]
font_size        = 12.0
font_weight      = "medium"
gap              = 8.0

[widgets.btn_scripts]
type             = "button"
icon             = "📁"
text             = "Scripts Folder"
action           = "command:open ~/.config/aerofi/scripts"
color            = "$text_subtle"
hover_color      = "$accent"
hover_background = "$hover_bg"
radius           = 8.0
padding          = [8.0, 8.0]
font_size        = 12.0
font_weight      = "medium"
gap              = 8.0

[widgets.sidebar_spacer]
type = "spacer"

[widgets.stats_card]
type        = "box"
orientation = "vertical"
gap         = 4.0
padding     = [10.0, 8.0]
background  = "$card_bg"
radius      = 8.0
children    = ["stats_status", "stats_hint"]

[widgets.stats_status]
type        = "text"
text        = "● Ready"
font_size   = 11.0
font_weight = "medium"
color       = "$green"

[widgets.stats_hint]
type      = "text"
text      = "↵ run · ⎋ hide"
font_size = 10.0
color     = "$subtle"

# === Main Content Pane (Right Column) ===
[widgets.main_pane]
type        = "box"
orientation = "vertical"
flex        = true
gap         = 10.0
children    = ["InputBar", "ListView"]

# === Row Action Buttons (Embedded inside each element row via layout) ===
[widgets.btn_run]
type             = "button"
icon             = "▶"
action           = "run"
color            = "$accent"
hover_color      = "#ffffff"
hover_background = "$accent_dim"
radius           = 6.0
padding          = [6.0, 3.0]
font_size        = 11.0

[widgets.btn_edit]
type             = "button"
icon             = "✎"
action           = "edit"
color            = "$subtle"
hover_color      = "$text"
hover_background = "$surface"
radius           = 6.0
padding          = [6.0, 3.0]
font_size        = 11.0

[widgets.btn_copy]
type             = "button"
icon             = "⎘"
action           = "copy"
color            = "$subtle"
hover_color      = "$text"
hover_background = "$surface"
radius           = 6.0
padding          = [6.0, 3.0]
font_size        = 11.0
