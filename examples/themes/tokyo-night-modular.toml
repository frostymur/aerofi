# ==============================================================================
# Tokyo Night Modular Example Theme
# ==============================================================================
# Location: ~/.config/aerofi/themes/tokyo-night-modular.toml
# Demonstrates splitting themes into reusable palette and layout files.
# Activate in ~/.config/aerofi/config.toml:
#   theme = "tokyo-night-modular"
# ==============================================================================

name   = "Tokyo Night Modular"
author = "aerofi"

# Compose theme by importing reusable colors and layout mixins:
imports = [
    "colors/tokyo-night.toml",
    "layouts/compact.toml",
]

# Optional local overrides for this specific theme:
[window]
width  = 660.0
height = 440.0
