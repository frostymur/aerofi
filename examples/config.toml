# ==============================================================================
# aerofi - Complete Configuration Reference (config.toml)
# ==============================================================================
# Location: ~/.config/aerofi/config.toml (or $XDG_CONFIG_HOME/aerofi/config.toml)
# Reload: Press Cmd+R in aerofi or trigger "Reload Configuration"
# ==============================================================================

# ------------------------------------------------------------------------------
# Active Theme
# ------------------------------------------------------------------------------
# Type: String
# Default: "default"
# Matches a theme file located at ~/.config/aerofi/themes/{theme}.toml
# Built-in fallback palettes: "default", "tokyo-night", "gruvbox"
theme = "tokyo-night"


[general]
# Maximum number of search results displayed in the list view.
# Type: Integer (usize)
# Default: 20
max_results = 20


# ------------------------------------------------------------------------------
# [sources] - Search Sources Indexing Toggles
# ------------------------------------------------------------------------------
[sources]
# Index macOS Application bundles (/Applications, /System/Applications, ~/Applications).
# Type: Boolean
# Default: true
apps = true

# Index launchable scripts from configured script folders.
# Type: Boolean
# Default: true
scripts = true

# Index macOS System Settings panes (reserved for a later release).
# Type: Boolean
# Default: true
system_settings = true


# ------------------------------------------------------------------------------
# [scripts] - Script Directories
# ------------------------------------------------------------------------------
[scripts]
# List of directories scanned recursively for executable scripts.
# Type: Array of Strings (PathBuf)
# Default: ["~/.config/aerofi/scripts"]
# Leading "~" is expanded to the user's home directory.
dirs = [
    "~/.config/aerofi/scripts",
    "~/scripts"
]


# ------------------------------------------------------------------------------
# [apps] - Application Filtering & Custom Discovery
# ------------------------------------------------------------------------------
[apps]
# List of application names to exclude from the launcher index.
# Type: Array of Strings
# Supports glob patterns:
#   "*" matches any sequence of characters
#   "?" matches any single character
#   Plain string performs an exact name match
ignore_names = [
    "Uninstall*",
    "Installer",
    "QuickTime Player",
    "*Helper",
    "Captive Network Assistant"
]

# List of directory paths to completely exclude from the launcher index.
# Type: Array of Strings (PathBuf)
ignore_dirs = [
    "~/Applications/Chrome Apps.localized"
]

# Additional directories to scan for `.app` bundles (e.g. Homebrew casks, custom tools).
# Note: aerofi automatically indexes /Applications, /System/Applications, and their
# Utilities/ folders (Activity Monitor, Console, Terminal, etc.) by default.
# Type: Array of Strings (PathBuf)
# Leading "~" is expanded to the user's home directory.
extra_dirs = [
    # "/opt/homebrew/Applications",
    # "~/Applications/Custom"
]

# Explicit individual `.app` bundle paths to include.
# Type: Array of Strings (PathBuf)
# Leading "~" is expanded to the user's home directory.
extra_apps = [
    # "/System/Library/CoreServices/Finder.app"
]


# ------------------------------------------------------------------------------
# [aliases] - Immediate Launch Aliases
# ------------------------------------------------------------------------------
# Maps shorthand keywords to target names.
# Type: Key-Value Table (String -> String)
# Typing an alias finds the target; typing the alias EXACTLY runs the target
# immediately without needing to press Enter.
[aliases]
"rc" = "Reload Configuration"
"cb" = "Clipboard History"
"term" = "Ghostty"
"browser" = "Safari"


# ------------------------------------------------------------------------------
# [bindings] - Unified Keybindings Configuration
# ------------------------------------------------------------------------------
[bindings]
# Global hotkey to toggle aerofi launcher visibility.
# Type: String
# Uses macOS Carbon FFI (RegisterEventHotKey) - requires zero Accessibility permissions.
toggle = "opt+space"

# ------------------------------------------------------------------------------
# [bindings.launcher] - In-Launcher Hotkeys
# ------------------------------------------------------------------------------
# Key combinations that trigger a target immediately while aerofi is open.
# Type: Key-Value Table (String -> String)
[bindings.launcher]
"cmd+r" = "Reload Configuration"
"cmd+," = "Open Configuration"
"cmd+t" = "Theme Switcher"

# ------------------------------------------------------------------------------
# [bindings.global] - System-Wide Quick Actions
# ------------------------------------------------------------------------------
# Global hotkeys registered directly via Carbon FFI.
# Runs the named target directly from anywhere without opening the launcher window.
[bindings.global]
"opt+c" = "Clipboard History"
"opt+t" = "Theme Switcher"

# ------------------------------------------------------------------------------
# [bindings.custom] - Rofi Mode Custom Keybindings
# ------------------------------------------------------------------------------
# Maps custom key combos to action return codes (retv: 10..28) in interactive Rofi mode.
# Supported keys: "kb-custom-1" through "kb-custom-19"
[bindings.custom]
"kb-custom-1" = "alt+1"
"kb-custom-2" = "alt+2"
"kb-custom-3" = "ctrl+d"
