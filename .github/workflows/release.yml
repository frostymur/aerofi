name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binaries
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
          - target: aarch64-apple-darwin
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/aerofi dist/
          cd dist
          tar -czf aerofi-mac-${{ matrix.arch }}.tar.gz aerofi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/aerofi-mac-${{ matrix.arch }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Tap
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: frostymur/homebrew-aerofi
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-aerofi

      - name: Calculate Checksums & Update Formula
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ARM64_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/aerofi-mac-arm64.tar.gz"
          X86_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/aerofi-mac-x86_64.tar.gz"

          echo "Target Release Tag: ${TAG}"

          EMPTY_SHA="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
          for i in {1..12}; do
            ARM64_SHA=$(curl -sSL "$ARM64_URL" | sha256sum | awk '{print $1}')
            X86_SHA=$(curl -sSL "$X86_URL" | sha256sum | awk '{print $1}')

            if [ -n "$ARM64_SHA" ] && [ "$ARM64_SHA" != "$EMPTY_SHA" ] && \
               [ -n "$X86_SHA" ] && [ "$X86_SHA" != "$EMPTY_SHA" ]; then
              echo "Checksums verified successfully:"
              echo "ARM64: ${ARM64_SHA}"
              echo "X86_64: ${X86_SHA}"
              break
            fi

            echo "Assets not ready yet, retrying in 5 seconds (attempt $i/12)..."
            sleep 5
          done

          if [ -z "$ARM64_SHA" ] || [ "$ARM64_SHA" = "$EMPTY_SHA" ] || \
             [ -z "$X86_SHA" ] || [ "$X86_SHA" = "$EMPTY_SHA" ]; then
            echo "Error: Failed to fetch valid release assets."
            exit 1
          fi

          cat <<EOF > homebrew-aerofi/Formula/aerofi.rb
class Aerofi < Formula
  desc "Lightweight, keyboard- and mouse-driven script launcher for macOS"
  homepage "https://github.com/frostymur/aerofi"
  license "MIT"

  if Hardware::CPU.arm?
    url "https://github.com/frostymur/aerofi/releases/download/${TAG}/aerofi-mac-arm64.tar.gz"
    sha256 "${ARM64_SHA}"
  else
    url "https://github.com/frostymur/aerofi/releases/download/${TAG}/aerofi-mac-x86_64.tar.gz"
    sha256 "${X86_SHA}"
  end

  def install
    bin.install "aerofi"
  end

  service do
    run opt_bin/"aerofi"
    keep_alive true
    process_type :interactive
  end

  test do
    system bin/"aerofi", "--version"
  end
end
EOF

      - name: Commit and push changes
        run: |
          cd homebrew-aerofi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/aerofi.rb
          if git diff --staged --quiet; then
            echo "No changes in formula to commit."
          else
            git commit -m "chore: bump aerofi to ${GITHUB_REF#refs/tags/}"
            git push origin main
          fi
