name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binaries
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
          - target: aarch64-apple-darwin
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/aerofi dist/
          cd dist
          tar -czf aerofi-mac-${{ matrix.arch }}.tar.gz aerofi
          zip -q aerofi-mac-${{ matrix.arch }}.zip aerofi
          shasum -a 256 aerofi-mac-${{ matrix.arch }}.tar.gz > aerofi-mac-${{ matrix.arch }}.tar.gz.sha256
          shasum -a 256 aerofi-mac-${{ matrix.arch }}.zip > aerofi-mac-${{ matrix.arch }}.zip.sha256

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aerofi-mac-${{ matrix.arch }}.tar.gz
            dist/aerofi-mac-${{ matrix.arch }}.zip
            dist/aerofi-mac-${{ matrix.arch }}.tar.gz.sha256
            dist/aerofi-mac-${{ matrix.arch }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Tap
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: frostymur/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          ref: main

      - name: Calculate Checksums & Update Formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          REPO="${{ github.repository }}"
          echo "Processing Homebrew formula for tag: ${TAG}"

          mkdir -p /tmp/aerofi-dist
          cd /tmp/aerofi-dist

          for i in {1..12}; do
            if gh release download "${TAG}" --repo "${REPO}" --pattern "*.tar.gz"; then
              if [ -f "aerofi-mac-arm64.tar.gz" ] && [ -f "aerofi-mac-x86_64.tar.gz" ]; then
                echo "Release assets verified on disk."
                break
              fi
            fi
            echo "Waiting for release assets to become available (attempt $i/12)..."
            sleep 5
          done

          if [ ! -f "aerofi-mac-arm64.tar.gz" ] || [ ! -f "aerofi-mac-x86_64.tar.gz" ]; then
            echo "Error: Failed to download release binaries from GitHub release."
            exit 1
          fi

          export TAG
          export REPO
          export ARM64_SHA=$(sha256sum aerofi-mac-arm64.tar.gz | awk '{print $1}')
          export X86_SHA=$(sha256sum aerofi-mac-x86_64.tar.gz | awk '{print $1}')

          echo "ARM64 SHA256: ${ARM64_SHA}"
          echo "X86_64 SHA256: ${X86_SHA}"

          cd "$GITHUB_WORKSPACE"

          python3 -c '
          import os
          import textwrap

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          arm64_sha = os.environ["ARM64_SHA"]
          x86_sha = os.environ["X86_SHA"]

          formula = f"""class Aerofi < Formula
            desc "Lightweight, keyboard- and mouse-driven script launcher for macOS"
            homepage "https://github.com/{repo}"
            license "MIT"

            if Hardware::CPU.arm?
              url "https://github.com/{repo}/releases/download/{tag}/aerofi-mac-arm64.tar.gz"
              sha256 "{arm64_sha}"
            else
              url "https://github.com/{repo}/releases/download/{tag}/aerofi-mac-x86_64.tar.gz"
              sha256 "{x86_sha}"
            end

            def install
              bin.install "aerofi"
            end

            service do
              run opt_bin/"aerofi"
              keep_alive true
              process_type :interactive
            end

            test do
              system bin/"aerofi", "--version"
            end
          end
          """

          clean_formula = textwrap.dedent(formula).strip() + "\n"

          with open("homebrew-tap/Formula/aerofi.rb", "w") as f:
              f.write(clean_formula)
          '

      - name: Commit and push changes
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/aerofi.rb
          if git diff --staged --quiet; then
            echo "No changes in formula to commit."
          else
            git commit -m "chore: bump aerofi to ${GITHUB_REF#refs/tags/}"
            git push origin HEAD:main
          fi
