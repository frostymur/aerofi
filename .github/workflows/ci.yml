name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: Cargo (Format, Clippy, Test, Build)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Build release binary
        run: cargo build --release

  brew:
    name: Homebrew Formula Validation
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup local tap for formula
        run: |
          brew tap-new frostymur/aerofi --no-git
          TAP_DIR="$(brew --repo frostymur/aerofi)/Formula"
          mkdir -p "$TAP_DIR"
          cp Formula/aerofi.rb "$TAP_DIR/aerofi.rb"

      - name: Check formula style
        run: brew style frostymur/aerofi/aerofi

      - name: Audit formula
        run: brew audit frostymur/aerofi/aerofi --strict --online || true

      - name: Install formula from source
        run: brew install --build-from-source frostymur/aerofi/aerofi

      - name: Test installed formula
        run: brew test frostymur/aerofi/aerofi
