name: Bug Report
description: Create a report to help us improve aerofi
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: aerofi version
      description: What version of aerofi are you running? You can find this by running `aerofi --version` or checking the releases.
      placeholder: e.g., v0.1.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS Version
      description: What version of macOS are you using?
      placeholder: e.g., macOS Sonoma 14.5
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open aerofi using 'opt+space'
        2. Type '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (logs, configuration snippets, screenshots, etc).
    validations:
      required: false
